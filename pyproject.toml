]

[tool.poetry]
packages = [{include = "pythonproject1", from = "src"}]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '''

[tool.isort]
line_length = 119

[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
mypy = "^1.17.1"
isort = "^6.0.1"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
